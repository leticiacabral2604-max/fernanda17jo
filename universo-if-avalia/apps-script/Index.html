<!doctype html><html lang="pt-BR"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px Arial;background:#f4f6fa;color:#18243a;margin:0}main{max-width:760px;margin:24px auto;padding:16px}section{background:white;border:1px solid #dde4ee;border-radius:14px;padding:20px;margin:14px 0}input,select,button{font:inherit;padding:12px;border:1px solid #ccd5e2;border-radius:8px;width:100%;margin:7px 0;box-sizing:border-box}button{background:#a87322;color:white;border:0;font-weight:bold;cursor:pointer}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{padding:10px;background:#f8f0df;border-radius:8px}@media(max-width:520px){main{margin:8px}.scores{grid-template-columns:1fr}}</style></head><body><main><h1>Universo IF Avalia</h1><p>Protótipo acadêmico — avaliação educativa, não oficial.</p><section><h2>Avaliar projeto</h2><form id="vote"><label>Código de avaliação<input id="token" autocomplete="off" required minlength="20"></label><label>Projeto<select id="project" required></select></label><div class="scores" id="scores"></div><button>Enviar avaliação</button></form><p id="result" class="status" role="status"></p></section><section><h2>Ranking público</h2><select id="modality"><option>Mostra Nacional</option><option>Mostra de Extensão</option></select><button id="load">Consultar ranking</button><div id="ranking"></div></section></main><script>const criteria=['Criatividade e inovação','Clareza da apresentação','Relevância e impacto','Demonstração e resultados'];criteria.forEach((c,i)=>{const l=document.createElement('label');l.textContent=c;const s=document.createElement('select');s.id='s'+i;s.required=true;s.innerHTML='<option value="">Nota (1 a 5)</option>'+[1,2,3,4,5].map(n=>'<option>'+n+'</option>').join('');l.append(s);document.getElementById('scores').append(l)});const preview=document.createElement('p');document.getElementById('scores').after(preview);const updatePreview=()=>{const v=[0,1,2,3].map(i=>Number(document.getElementById('s'+i).value));preview.textContent=v.every(n=>n>=1&&n<=5)?'Prévia da nota ponderada: '+(v[0]*.3+v[1]*.3+v[2]*.25+v[3]*.15).toFixed(2):'Preencha os quatro critérios para ver a prévia.'};[0,1,2,3].forEach(i=>document.getElementById('s'+i).addEventListener('change',updatePreview));let pendingRequestId='',pendingFingerprint='';google.script.run.withSuccessHandler(ps=>{document.getElementById('project').innerHTML=ps.map(p=>'<option value="'+p.id+'">'+p.id+' — '+p.titulo.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</option>').join('');const initial='<?= projectId ?>';if(initial)document.getElementById('project').value=initial}).withFailureHandler(e=>alert(e.message)).getProjects();document.getElementById('vote').onsubmit=e=>{e.preventDefault();const basePayload={token:document.getElementById('token').value,projectId:document.getElementById('project').value,scores:[0,1,2,3].map(i=>Number(document.getElementById('s'+i).value))};if(!basePayload.scores.every(n=>n>=1&&n<=5))return;if(!confirm('Confirma o envio desta avaliação?'))return;const fingerprint=JSON.stringify(basePayload);if(fingerprint!==pendingFingerprint){pendingFingerprint=fingerprint;pendingRequestId=crypto.randomUUID()}const btn=e.target.querySelector('button');btn.disabled=true;const payload={...basePayload,requestId:pendingRequestId};google.script.run.withSuccessHandler(r=>{document.getElementById('result').textContent='Avaliação recebida. Recibo: '+r.receipt+' · Nota: '+r.score;document.getElementById('token').value='';pendingRequestId='';pendingFingerprint='';btn.disabled=false}).withFailureHandler(e=>{document.getElementById('result').textContent=e.message;btn.disabled=false}).submitEvaluation(payload)};document.getElementById('load').onclick=()=>google.script.run.withSuccessHandler(r=>{const box=document.getElementById('ranking');box.replaceChildren();const stamp=document.createElement('p');stamp.textContent=r.atualizadoEm?'Última avaliação: '+new Date(r.atualizadoEm).toLocaleString('pt-BR'):'Ainda não há avaliações válidas.';box.append(stamp);r.projetos.forEach(p=>{const row=document.createElement('article');const title=document.createElement('p');title.textContent=(p.posicao?'#'+p.posicao:'Aguardando amostra mínima')+' · '+p.titulo+' — '+(p.media??'—')+' ('+p.quantidade+' avaliações)';const details=document.createElement('small');details.textContent=criteria.map((c,i)=>c+': '+(p.criterios[i]??'—')).join(' · ');row.append(title,details);box.append(row)})}).withFailureHandler(e=>alert(e.message)).getPublicRanking(document.getElementById('modality').value);</script></body></html>
