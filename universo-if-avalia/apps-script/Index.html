<!doctype html><html lang="pt-BR"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px Arial;background:#f4f6fa;color:#18243a;margin:0}main{max-width:760px;margin:24px auto;padding:16px}section{background:white;border:1px solid #dde4ee;border-radius:14px;padding:20px;margin:14px 0}input,select,button{font:inherit;padding:12px;border:1px solid #ccd5e2;border-radius:8px;width:100%;margin:7px 0;box-sizing:border-box}[hidden]{display:none!important}button{background:#a87322;color:white;border:0;font-weight:bold;cursor:pointer}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{padding:10px;background:#f8f0df;border-radius:8px}@media(max-width:520px){main{margin:8px}.scores{grid-template-columns:1fr}}.scores{grid-template-columns:1fr}.criterion{border:1px solid #dde4ee;border-radius:12px;padding:12px;min-width:0;margin:0}.criterion legend{font-weight:700}.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.choices label{position:relative;cursor:pointer}.choices input{position:absolute;opacity:0;width:1px;height:1px}.choices span{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid #ccd5e2;border-radius:9px;font-weight:bold}.choices input:checked+span{background:#2359a6;color:white;border-color:#2359a6}.choices input:focus-visible+span{outline:3px solid #a87322}.rank-card{display:grid;grid-template-columns:44px minmax(0,1fr) 64px;gap:12px;align-items:center;border:1px solid #dde4ee;border-radius:12px;padding:14px;margin:10px 0}.rank-pos{font-weight:bold;font-size:22px;text-align:center;color:#2359a6}.rank-score{font-size:22px;font-weight:bold;text-align:right}.rank-card small{display:block;color:#536278}.rank-card p{margin:4px 0;overflow-wrap:anywhere}.rank-card:first-of-type{border-color:#a87322}.rank-card.pending{opacity:.8}button:disabled{opacity:.6}</style></head><body><main><h1>Universo IF Avalia</h1><p>Protótipo acadêmico — avaliação educativa, não oficial.</p><section><h2>Avaliar projeto</h2><p id="votingStatus" class="status" role="status">Consultando disponibilidade da votação…</p><form id="vote" hidden><label>Código de avaliação<input id="token" autocomplete="off" required minlength="20"></label><label>Projeto<select id="project" required></select></label><div class="scores" id="scores"></div><button>Enviar avaliação</button></form><p id="result" class="status" role="status"></p></section><section id="ranking-section"><h2>Ranking público</h2><select id="modality"><option>Mostra Nacional</option><option>Mostra de Extensão</option></select><button id="load">Consultar ranking</button><div id="ranking"></div></section></main><script>const criteria=['Criatividade e inovação','Clareza da apresentação','Relevância e impacto','Demonstração e resultados'];const weights=[30,30,25,15];criteria.forEach((c,i)=>{const f=document.createElement('fieldset');f.className='criterion';const legend=document.createElement('legend');legend.textContent=c+' ('+weights[i]+'%)';f.append(legend);const choices=document.createElement('div');choices.className='choices';[1,2,3,4,5].forEach(n=>{const l=document.createElement('label'),radio=document.createElement('input'),span=document.createElement('span');radio.type='radio';radio.name='s'+i;radio.value=n;radio.required=true;span.textContent=n;l.append(radio,span);choices.append(l)});f.append(choices);document.getElementById('scores').append(f)});const readScores=()=>[0,1,2,3].map(i=>Number(document.querySelector('input[name="s'+i+'"]:checked')?.value||0));const preview=document.createElement('p');document.getElementById('scores').after(preview);const updatePreview=()=>{const v=readScores();preview.textContent=v.every(n=>n>=1&&n<=5)?'Prévia da nota ponderada: '+(v[0]*.3+v[1]*.3+v[2]*.25+v[3]*.15).toFixed(2):'Preencha os quatro critérios para ver a prévia.'};document.getElementById('scores').addEventListener('change',updatePreview);updatePreview();let votingOpen=false;const voteForm=document.getElementById('vote'),votingStatus=document.getElementById('votingStatus');function checkVotingStatus(){google.script.run.withSuccessHandler(r=>{votingOpen=r.open===true;voteForm.hidden=!votingOpen;votingStatus.textContent=votingOpen?'Votação aberta. Você pode enviar sua avaliação.':'Avaliação encerrada no momento. Você pode consultar os projetos e o ranking, mas não enviar notas.'}).withFailureHandler(()=>{votingOpen=false;voteForm.hidden=true;votingStatus.textContent='Não foi possível verificar a votação. O envio de avaliações está indisponível por segurança.'}).getVotingStatus()}checkVotingStatus();let pendingRequestId='',pendingFingerprint='';google.script.run.withSuccessHandler(ps=>{document.getElementById('project').innerHTML=ps.map(p=>'<option value="'+p.id+'">'+p.id+' — '+p.titulo.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</option>').join('');const initial='<?= projectId ?>';if(initial)document.getElementById('project').value=initial}).withFailureHandler(e=>alert(e.message)).getProjects();document.getElementById('vote').onsubmit=e=>{e.preventDefault();if(!votingOpen){votingStatus.textContent='Avaliação fechada. Não é possível enviar notas.';return;}const basePayload={token:document.getElementById('token').value,projectId:document.getElementById('project').value,scores:readScores()};if(!basePayload.scores.every(n=>n>=1&&n<=5))return;if(!confirm('Confirma o envio desta avaliação?'))return;const fingerprint=JSON.stringify(basePayload);if(fingerprint!==pendingFingerprint){pendingFingerprint=fingerprint;pendingRequestId=crypto.randomUUID()}const btn=e.target.querySelector('button');btn.disabled=true;const payload={...basePayload,requestId:pendingRequestId};google.script.run.withSuccessHandler(r=>{document.getElementById('result').textContent='Avaliação recebida. Recibo: '+r.receipt+' · Nota: '+r.score;document.getElementById('token').value='';pendingRequestId='';pendingFingerprint='';btn.disabled=false}).withFailureHandler(e=>{document.getElementById('result').textContent=e.message;btn.disabled=false}).submitEvaluation(payload)};document.getElementById('load').onclick=()=>google.script.run.withSuccessHandler(r=>{const box=document.getElementById('ranking');box.replaceChildren();const stamp=document.createElement('p');stamp.textContent=r.atualizadoEm?'Última avaliação: '+new Date(r.atualizadoEm).toLocaleString('pt-BR'):'Ainda não há avaliações válidas.';box.append(stamp);const pending=r.projetos.filter(p=>!p.posicao);r.projetos.filter(p=>p.posicao).forEach(p=>{const row=document.createElement('article');row.className='rank-card';const pos=document.createElement('div');pos.className='rank-pos';pos.textContent=p.posicao+'º';const info=document.createElement('div');const title=document.createElement('p');title.textContent=p.titulo;const count=document.createElement('small');count.textContent=p.id+' · '+p.quantidade+' avaliações';info.append(title,count);const score=document.createElement('div');score.className='rank-score';score.textContent=Number(p.media).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});row.append(pos,info,score);box.append(row)});const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent=pending.length+' projetos aguardando amostra mínima';details.append(summary);pending.forEach(p=>{const line=document.createElement('p');line.textContent=p.id+' — '+p.titulo+' ('+p.quantidade+'/5)';details.append(line)});box.append(details)}).withFailureHandler(e=>alert(e.message)).getPublicRanking(document.getElementById('modality').value);;if(location.hash==="#ranking"){document.getElementById("ranking-section").scrollIntoView();document.getElementById("load").click()}</script></body></html>
